[project]
name = "ege-template"
type = "executable"
version = "0.1.0"
language = "C++17"    #  EGE推荐的版本

[compile]
flags = ["-Wall", "-Wextra"]
default_profile = "debug"
include_dirs = ["include"]

[compile.profile.debug]
flags = ["-g", "-O0"]
msvc_flags = ["/Zi", "/Od"]

[compile.profile.release]
flags = ["-O2", "-DNDEBUG"]
msvc_flags = ["/O2", "/DNDEBUG"]
export_objs = true               # LGPL要求静态链接的程序需要提供用于重新链接的对象文件

[link]
flags = []
link_dirs = ["lib/ege/mingw64"]                  # 可根据所需版本不同更换不同文件夹的libgraphics.a或者graphics.lib
system_target = ["graphics", "gdi32", "gdiplus"]

[depends]
lib = []

